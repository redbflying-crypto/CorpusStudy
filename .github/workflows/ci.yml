name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Build the Bible corpus (commentaries are hand-imported and skipped here)
        run: python -m corpusstudy.ingest
      - name: Committed tables and knowledge bundle must not drift
        run: git diff --exit-code
      - name: Build the search index
        run: python -m corpusstudy.indexing
      - name: Tests
        run: pytest -rs
      - name: Knowledge bundle (OKF v0.2 conformance + producer profile)
        run: python -m corpusstudy.okf check

  docker:
    # Phase 8 exit check: from a clean checkout the container builds, prepares the corpus
    # (Bibles downloaded; no commentary files here) and answers a lookup.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
      - name: Start (downloads the Bibles, builds the index)
        run: docker compose up -d
      - name: Wait until healthy
        run: |
          for i in $(seq 1 120); do
            status=$(docker inspect --format '{{.State.Health.Status}}' corpusstudy-corpusstudy-1)
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          exit 1
      - name: A lookup through the API
        run: |
          curl -fsS -X POST 127.0.0.1:8000/chat -H 'content-type: application/json' \
            -d '{"message": "John 3:16"}' | grep -q "For God so loved the world"
      - name: Logs
        if: always()
        run: docker compose logs --tail 60
