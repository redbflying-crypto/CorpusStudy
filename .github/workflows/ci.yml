name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Build the Bible corpus (commentaries are hand-imported and skipped here)
        run: python -m corpusstudy.ingest
      - name: Committed tables and knowledge bundle must not drift
        run: git diff --exit-code
      - name: Tests
        run: pytest -rs
      - name: Knowledge bundle (OKF v0.2 conformance + producer profile)
        run: python -m corpusstudy.okf check
