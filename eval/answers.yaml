# ---------------------------------------------------------------- cross-tradition
- q: "Do Catholics and Protestants agree on justification?"
  lang: en
  category: cross_tradition
  route: interpretive
  concept: doctrines/justification
  gist: Reformed - forensic, by faith alone, Christ's righteousness imputed; Roman Catholic (Trent) - includes inner renewal, can grow and be lost; stated fairly.
- q: "How do Calvinists and Arminians differ on election?"
  lang: en
  category: cross_tradition
  route: interpretive
  concept: doctrines/election
  gist: Unconditional election versus election conditioned on foreseen faith; both affirm grace; stated fairly.
- q: "Is Christ physically present in the Lord's Supper?"
  lang: en
  category: cross_tradition
  route: knowledge
  concept: doctrines/sacraments
  refs: [1Cor.10.16, 1Cor.11.23-1Cor.11.26]
  gist: Reformed - Christ truly present and received by faith through the Spirit; Lutheran, Roman Catholic and memorial views noted.
- q: "What do different Christians believe about the millennium?"
  lang: en
  category: cross_tradition
  route: knowledge
  concept: books/revelation
  refs: [Rev.20.1-Rev.20.6]
  gist: Amillennial, postmillennial and premillennial readings of Revelation 20, without taking sides.
- q: "Les catholiques et les protestants lisent-ils Matthieu 16.18 de la même façon ?"
  lang: fr
  category: cross_tradition
  route: interpretive
  refs: [Matt.16.18]
  gist: In French; Reformed reading (Christ confessed) and Roman Catholic reading (Peter and his successors), fairly.

