# Answer evaluation set (Phase 7).
#
# Each case: a question, its language, the route it must take, and for review:
#   gist     what a correct answer says (for you to check: the Phase 7 gate)
#   refs     passages a good answer would normally cite (informational, OSIS, in the
#            answer language's numbering)
#   concept  a knowledge concept the question names (knowledge / hybrid routes)
#   concern  pastoral cases: self-harm | abuse | despair
#   valid    lookups only: false when the reference does not exist
#
# Offline checks (no API key): routing, language detection, named concepts, safety
# messages, lookups. Live checks (--live): every answer's citations verified, answer rate,
# expected passages cited. Routes assume the knowledge bundle is in use (drafts until
# reviewed).
#
# Categories: lookup_en, lookup_fr, doctrine_en, doctrine_fr, people_en, people_fr,
# history, books, cross_tradition, open_en, open_fr, safety, not_safety.

