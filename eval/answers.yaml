# ---------------------------------------------------------------- doctrine
- q: "What is justification?"
  lang: en
  category: doctrine_en
  route: knowledge
  concept: doctrines/justification
  refs: [Rom.3.28, Rom.4.5, Rom.5.1, 2Cor.5.21]
  gist: God's legal verdict declaring the ungodly righteous for Christ's sake, received by faith alone; distinct from sanctification but never separate; James 2 read as showing true faith.
- q: "What does the Bible teach about election and predestination?"
  lang: en
  category: doctrine_en
  route: knowledge
  concept: doctrines/election
  refs: [Eph.1.4-Eph.1.5, Rom.8.29-Rom.8.30, Rom.9.11-Rom.9.16]
  gist: God chose a people in Christ before the foundation of the world, not on foreseen merit; election is the ground of assurance and humility; notes Arminian conditional election fairly.
- q: "What is the atonement?"
  lang: en
  category: doctrine_en
  route: knowledge
  concept: doctrines/atonement
  refs: [Isa.53.5-Isa.53.6, Rom.3.25, 1Pet.2.24]
  gist: Christ's death as a substitutionary sacrifice satisfying God's justice; definite atonement in Reformed teaching, with other views noted.
- q: "How does sanctification differ from justification?"
  lang: en
  category: doctrine_en
  route: knowledge
  concept: doctrines/sanctification
  refs: [Rom.6.1-Rom.6.14, 1Thess.4.3, Phil.2.12-Phil.2.13]
  gist: Justification is a once-for-all verdict; sanctification is the Spirit's lifelong work of renewal, never complete in this life.
- q: "Can a true believer lose their salvation?"
  lang: en
  category: doctrine_en
  route: knowledge
  concept: themes/salvation
  refs: [John.10.28-John.10.29, Phil.1.6, Rom.8.38-Rom.8.39]
  gist: Reformed answer - perseverance of the saints (God keeps those he saves); warning passages (Hebrews 6) as means of perseverance; Arminian, Lutheran and Catholic views noted.
- q: "Why do Reformed churches baptize infants?"
  lang: en
  category: doctrine_en
  route: interpretive
  concept: doctrines/sacraments
  refs: [Gen.17.7, Acts.2.39, Acts.16.33]
  gist: Continuity of the covenant of grace (sign given to believers' children, as circumcision was); household baptisms; Baptist credobaptism noted fairly.
- q: "What is grace?"
  lang: en
  category: doctrine_en
  route: knowledge
  concept: themes/grace
  refs: [Eph.2.8-Eph.2.9, Rom.11.6]
  gist: God's undeserved favour; salvation by grace not works; common and saving grace distinguished.
- q: "Is Scripture inspired by God?"
  lang: en
  category: doctrine_en
  route: knowledge
  concept: doctrines/scripture
  refs: [2Tim.3.16, 2Pet.1.21]
  gist: All Scripture is God-breathed; the human writers were moved by the Spirit without losing their own minds; authority rests on God.
- q: "Qu'est-ce que la justification par la foi ?"
  lang: fr
  category: doctrine_fr
  route: knowledge
  concept: doctrines/justification
  refs: [Rom.3.28, Rom.5.1]
  gist: In French, quoting the Louis Segond; same content as the English case.
- q: "Qu'est-ce que la grâce ?"
  lang: fr
  category: doctrine_fr
  route: knowledge
  concept: themes/grace
  refs: [Eph.2.8]
  gist: In French; « c'est par la grâce que vous êtes sauvés » (Éphésiens 2.8).
- q: "Que signifie l'élection ?"
  lang: fr
  category: doctrine_fr
  route: knowledge
  concept: doctrines/election
  refs: [Eph.1.4]
  gist: In French; God's choice in Christ before the foundation of the world.
- q: "Pourquoi le baptême ?"
  lang: fr
  category: doctrine_fr
  route: knowledge
  concept: doctrines/sacraments
  refs: [Matt.28.19, Rom.6.3-Rom.6.4]
  gist: In French; baptism as sign and seal of union with Christ, commanded by Christ; Reformed and Baptist practice noted.

